runtime: python311

entrypoint: gunicorn -b :$PORT main:app --timeout 120 --workers 4 --threads 2

instance_class: F2

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 5
  min_pending_latency: 30ms
  max_pending_latency: automatic

env_variables:
  FLASK_ENV: 'production'
  PYTHONUNBUFFERED: 'true'

includes:
  - env_variables.yaml  # For environment-specific variables (create this file for secrets)

handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
